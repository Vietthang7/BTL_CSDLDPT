<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSearch - Instrument Recognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="container">

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-box" id="dropZone">
                    <div class="upload-icon">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <h3>Kéo thả file hoặc click để tải lên</h3>
                    <p>Hỗ trợ định dạng .wav</p>
                    <input type="file" id="audioFile" accept=".wav" class="file-input">
                    <label for="audioFile" class="btn-primary">Chọn File</label>
                </div>

                <div class="controls">
                    <button id="searchBtn" class="btn-search" onclick="searchAudio()" disabled>
                        <i class="fa-solid fa-magnifying-glass"></i> Bắt Đầu Phân Tích
                    </button>
                </div>
            </div>

            <div id="uploadPreview" class="preview-card" style="display: none;">
                <div class="preview-info">
                    <i class="fa-solid fa-file-audio"></i>
                    <div class="preview-text">
                        <span class="preview-title">File đã chọn</span>
                        <span id="uploadFilename" class="preview-filename"></span>
                    </div>
                </div>
                <audio id="uploadedAudio" controls preload="none"></audio>
            </div>

            <div id="loading" class="loading-container" style="display: none;">
                <div class="loader">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                    <div class="bar4"></div>
                    <div class="bar5"></div>
                    <div class="bar6"></div>
                </div>
                <p>Đang trích xuất đặc trưng AI 19 chiều & truy xuất cơ sở dữ liệu...</p>
            </div>

            <div id="resultBox" class="result-container" style="display: none;">
                <div class="result-header">
                    <h2><i class="fa-solid fa-ranking-star"></i> Top 5 Kết Quả Tương Đồng</h2>
                </div>
                <div class="table-responsive">
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nhạc cụ</th>
                                <th>Tên File</th>
                                <th>Độ tương đồng</th>
                                <th>Nghe</th>
                            </tr>
                        </thead>
                        <tbody id="resultCards">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // File input logic
        const fileInput = document.getElementById('audioFile');
        const dropZone = document.getElementById('dropZone');
        const searchBtn = document.getElementById('searchBtn');

        fileInput.addEventListener('change', function () {
            handleFileSelect(this.files[0]);
        });

        // Drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('highlight');
        }

        function unhighlight(e) {
            dropZone.classList.remove('highlight');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0 && files[0].name.endsWith('.wav')) {
                fileInput.files = files;
                handleFileSelect(files[0]);
            } else {
                alert("Vui lòng chỉ tải lên file .wav");
            }
        }

        function handleFileSelect(file) {
            if (file) {
                setUploadPreview(file);
                searchBtn.disabled = false;
                dropZone.classList.add('has-file');
                dropZone.querySelector('h3').textContent = 'Đã chọn file';
            } else {
                searchBtn.disabled = true;
                dropZone.classList.remove('has-file');
                dropZone.querySelector('h3').textContent = 'Kéo thả file hoặc click để tải lên';
            }
        }

        function setUploadPreview(file) {
            const preview = document.getElementById('uploadPreview');
            const audio = document.getElementById('uploadedAudio');
            const filename = document.getElementById('uploadFilename');

            if (!file) {
                preview.style.display = 'none';
                audio.removeAttribute('src');
                return;
            }

            filename.textContent = file.name;
            audio.src = URL.createObjectURL(file);
            preview.style.display = 'flex';
        }

        function buildResultAudioUrl(item) {
            const instrument = encodeURIComponent(item.instrument);
            const filename = encodeURIComponent(item.filename);
            return `/audio/${instrument}/${filename}`;
        }

        async function searchAudio() {
            if (fileInput.files.length === 0) {
                alert('Vui lòng chọn 1 file .wav!');
                return;
            }

            const formData = new FormData();
            formData.append('audio', fileInput.files[0]);

            document.getElementById('loading').style.display = 'flex';
            document.getElementById('resultBox').style.display = 'none';
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang phân tích...';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    const resultCards = document.getElementById('resultCards');
                    resultCards.innerHTML = '';

                    data.results.forEach((item, index) => {
                        const audioUrl = buildResultAudioUrl(item);
                        const similarity = Math.max(0, (1 - (item.distance / 2)) * 100).toFixed(1);

                        let iconClass = "fa-music";
                        const inst = item.instrument.toLowerCase();
                        if (inst.includes('piano')) iconClass = "fa-keyboard";
                        else if (inst.includes('guitar')) iconClass = "fa-guitar";
                        else if (inst.includes('drum')) iconClass = "fa-drum";
                        else if (inst.includes('violin')) iconClass = "fa-scroll";

                        const row = `
                        <tr style="animation-delay: ${index * 0.1}s" class="fade-in-row">
                            <td class="rank-cell">${index + 1}</td>
                            <td>
                                <div class="instrument-tag">
                                    <i class="fa-solid ${iconClass}"></i> ${item.instrument}
                                </div>
                            </td>
                            <td class="filename-cell" title="${item.filename}">${item.filename}</td>
                            <td>
                                <div class="similarity-badge">
                                    <i class="fa-solid fa-bullseye"></i> ~${similarity}%
                                </div>
                            </td>
                            <td>
                                <audio controls preload="none" src="${audioUrl}"></audio>
                            </td>
                        </tr>`;
                        resultCards.innerHTML += row;
                    });

                    document.getElementById('resultBox').style.display = 'block';

                    setTimeout(() => {
                        document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (error) {
                alert('Có lỗi xảy ra khi kết nối đến Server.');
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Bắt Đầu Phân Tích';
            }
        }
    </script>
</body>

</html>
